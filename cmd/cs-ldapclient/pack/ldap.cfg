# cs-ldapclient: settings. Keep this file next to the program, e.g. on a USB stick.
# It contains the password of the reader account: protect the stick.

# IP or name of the cs-team LDAP server (LDAPS)
server = 
port = 636
# base DN of the cs-team directory
base = dc=csteam,dc=local
# reader account (CS_LDAP_READER): uid or full DN
reader = ldapread
reader_password = 
# cs-team group = local group, separated by ; (Windows: Users, Administrators; Linux/FreeBSD: sudo/admin or any)
groups = lehrer=Administrators;klasse5a=Users
# delete the local account/profile/home at logout (yes/no)
remove_profiles = yes
# Windows: short account creation, hide user list (yes/no)
short_setup = yes
hide_users = yes
# certificate of the cs-team server (PEM, next to this file) and the fingerprint it was accepted with
cert_file = ldap.pem
cert_sha256 = 
# Windows: pGina installer next to this file (empty = pGinaSetup*.exe, else download)
installer = 
download_url = https://github.com/MutonUfoAI/pgina/releases/download/3.9.9.12/pGinaSetup-3.9.9.12.exe
# language of the program: de, en (empty = from the system)
lang = 
