<style>
*{box-sizing:border-box}

#nav{display:flex;gap:2px;flex:1}

#list{flex:1;overflow:auto}

#list .item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .xdel{flex:none;border:0;background:none;color:#a33;cursor:pointer;font-size:13px;padding:0 4px;border-radius:3px;visibility:hidden}
#list .item:hover .xdel,#list .item.act .xdel{visibility:visible}
#list .xdel:hover{background:#f5d5d5}

#main{flex:1;padding:12px 16px;overflow:auto;min-width:0}
#wcbox{display:none;flex:1;flex-direction:column;min-width:0}#wcbar{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid #ccd;align-items:center}#wcbar button.on{background:#25405f;color:#fff}#wcfr{flex:1;position:relative}#wcfr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}body.wc #main{display:none}body.wc #wcbox{display:flex}
h3{margin:.2em 0 .6em}

button{font:inherit}

/* Calc + Text */

#grid{position:relative;overflow:auto;max-height:64vh;outline:0;border:1px solid #ccc}

#sstat{min-height:1.4em;padding:3px 4px;font-size:12.5px;color:#333}#shint{font-size:12px}
.par{display:block;width:100%;box-sizing:border-box;border-bottom:1px dotted #ddd;background:#eeeff1;border-radius:3px;margin-bottom:6px;font:inherit;padding:4px;min-height:1.5em;white-space:pre-wrap;overflow-wrap:anywhere;outline:0}
.par.cur{background:#e8f0fb}#doc:focus{outline:0}#doc[contenteditable=true]{cursor:text}.par a{color:#1a56c4;text-decoration:underline;cursor:pointer}.par span.cmt{font-weight:700!important;color:#1a56c4!important;text-decoration:underline!important;cursor:help}#grid td.cmc{background-image:linear-gradient(225deg,#d93025 0,#d93025 6px,transparent 6px)!important;background-repeat:no-repeat}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

/* Chat */
#main.chat{padding:0;overflow:hidden}
.chw{display:flex;height:100%;min-height:0}

.cm.mn{background:#fffbe6;border-left:3px solid #f59e0b}

#rtc{position:fixed;inset:0;z-index:2000;background:#111;color:#eee;display:flex;flex-direction:column}

.rtile video{width:100%;height:100%;object-fit:cover;background:#222}.rtile[data-p=me] video{transform:scaleX(-1)}
.rtile .rname{position:absolute;left:8px;bottom:6px;background:#0009;padding:1px 8px;border-radius:4px;font-size:13px}
.rtile .rst{position:absolute;right:8px;top:6px;font-size:12px;background:#b91c1c;border-radius:4px;padding:0 6px}.rtile .rst:empty{display:none}
#rtc .rbar{padding:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#rtc .rbar button{border:0;border-radius:20px;padding:9px 18px;font-size:14px;background:#333;color:#eee;cursor:pointer}#rtc .rbar button:disabled{opacity:.5;cursor:default}#rtc .rbar button.on{background:#7a4b00}#rtc .rbar .rhang{background:#c0392b;color:#fff}
.vcard{display:inline-block;border:1px solid #b9cdea;border-radius:6px;padding:6px 10px;background:#f2f7ff;margin:2px 0}.vcard.old{opacity:.6;background:#f5f5f5;border-color:#ccc}.vcard button{margin-left:8px}
.cm .cimg{max-width:320px;max-height:240px;border-radius:6px;display:block;margin:3px 0}

.cm:hover .acts{display:block}
.cm .acts button{border:0;background:none;cursor:pointer;padding:2px 5px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.poll{border:1px solid #b9cdea;border-radius:6px;padding:8px 10px;background:#f7faff;margin:2px 0;max-width:460px}

.poll button.po{cursor:pointer}.poll .po.mine{border-color:#3b82f6}
.poll .pb{position:absolute;left:0;top:0;bottom:0;background:#dbeafe}.poll .po>span:not(.pb){position:relative}
.poll .pv{font-size:12px;color:#666;margin:1px 0 0 8px;overflow-wrap:anywhere}
.poll .pf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:#666}
.rx button{border:1px solid #ddd;background:#f5f5f5;border-radius:10px;cursor:pointer;padding:0 7px;font-size:13px}
.rx button.mine{background:#dbeafe;border-color:#3b82f6}
.day{display:flex;align-items:center;gap:8px;color:#888;font-size:12px;margin:10px 0 4px}

.chc{border-top:1px solid #ddd;padding:8px 14px;display:flex;gap:6px;align-items:flex-end}

/* Aufgaben */
.tkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tkh h3{margin:0}
#tkboard{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;margin-top:8px}.tkcol{flex:1;min-width:220px;background:#f1f3f6;border-radius:6px;padding:6px;min-height:120px}.tkch{font-weight:600;margin:2px 4px 6px}.tkcard{background:#fff;border-radius:5px;padding:6px 8px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:pointer;overflow-wrap:anywhere}.tkcard .pr{color:#dc2626}.tkcm{font-size:12px}.tkcol.over{outline:2px dashed #3b82f6}.tklb{font-size:11px;background:#e0e7ff;color:#1e2a5a;border-radius:8px;padding:0 6px;display:inline-block;margin:1px 0}#main .row button.on{background:#dbe8fb;border-color:#6b94d6}.tdr{padding:3px 6px;border-radius:4px;cursor:pointer}.tdr:hover{background:#eef3fb}.cpk{display:block;padding:2px 4px}.cpk b{display:inline-block;min-width:1.8em;color:#1a56c4}.cpl{max-height:170px;overflow:auto;border:1px solid #d5d5d5;border-radius:6px;padding:4px;margin:6px 0}.nws{border-left:3px solid #1a56c4;padding:4px 8px;margin:8px 0}#newver{position:fixed;top:0;left:0;right:0;z-index:60;background:#fff3cd;color:#664d03;padding:6px 12px;text-align:center;border-bottom:1px solid #e5c76b}#newver button{margin-left:8px}#guestbar{background:#e7f1ff;color:#0b3a7a;padding:3px 12px;text-align:center;font-size:12px;flex:none}.rq{border-left:3px solid #9aa4ae;padding:1px 6px;margin:2px 0;font-size:12px;color:#667;cursor:pointer}.rc a{font-size:12px}.nwt{white-space:pre-wrap;overflow-wrap:anywhere}.nwn{color:#e11d48}
.tkst{font-size:12px;border-radius:10px;padding:1px 9px;color:#fff;background:#94a3b8}
.tkst.st-doing{background:#3b82f6}.tkst.st-done{background:#16a34a}.tkst.st-closed{background:#9ca3af}.tkst.st-over{background:#dc2626}
